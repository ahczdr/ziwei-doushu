name: v0.1.2 Version Bump

on:
  push:
    branches:
      - release/v0.1.2
    paths:
      - '.github/workflows/v012-version-bump.yml'

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/v0.1.2
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Update version metadata
        run: |
          set -euo pipefail
          npm version 0.1.2 --no-git-tag-version
          printf '0.1.2\n' > VERSION
          test "$(node -p "require('./package.json').version")" = '0.1.2'
          test "$(node -p "require('./package-lock.json').version")" = '0.1.2'
          test "$(node -p "require('./package-lock.json').packages[''].version")" = '0.1.2'
          test "$(cat VERSION)" = '0.1.2'

      - name: Commit version bump
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json VERSION
          git diff --cached --check
          git commit -m 'release: bump version to 0.1.2'
          git push origin HEAD:release/v0.1.2
