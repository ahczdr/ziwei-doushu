name: Ziwei AI P1-P2

on:
  push:
    branches:
      - project/ziwei-ai-integration
      - project/ziwei-ai-p2-ui
  pull_request:
    branches:
      - main
      - project/ziwei-ai-integration

jobs:
  deterministic-chart:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: TypeScript strict check
        run: npm run typecheck

      - name: P1-P2 deterministic regression tests
        run: npm run test:ziwei-ai
