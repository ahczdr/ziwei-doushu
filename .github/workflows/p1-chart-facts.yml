name: P1 ChartFacts

on:
  push:
    branches:
      - project/ziwei-ai-integration
  pull_request:
    branches:
      - main

jobs:
  chart-facts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: TypeScript strict check
        run: npm run typecheck

      - name: P1 deterministic regression tests
        run: npm run test:p1
