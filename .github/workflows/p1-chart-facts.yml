name: Ziwei AI P1-P3

on:
  push:
    branches:
      - project/ziwei-ai-integration
      - project/ziwei-ai-p2-ui
      - project/ziwei-ai-p3-pattern-engine
  pull_request:
    branches:
      - main
      - project/ziwei-ai-integration
      - project/ziwei-ai-p2-ui

jobs:
  deterministic-chart:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: TypeScript strict check
        run: npm run typecheck

      - name: P1-P3 deterministic regression tests
        run: npm run test:ziwei-ai

      - name: Next.js production build
        run: npm run build
