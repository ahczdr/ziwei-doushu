name: Ziwei AI P1-P7

on:
  push:
    branches:
      - project/ziwei-ai-integration
      - project/ziwei-ai-p2-ui
      - project/ziwei-ai-p3-pattern-engine
      - project/ziwei-ai-p4-rag
      - project/ziwei-ai-p5-agent
      - project/ziwei-ai-p6-critic
      - project/ziwei-ai-p7-platform
  pull_request:
    branches:
      - main
      - project/ziwei-ai-integration
      - project/ziwei-ai-p2-ui
      - project/ziwei-ai-p3-pattern-engine
      - project/ziwei-ai-p4-rag
      - project/ziwei-ai-p5-agent
      - project/ziwei-ai-p6-critic

jobs:
  deterministic-chart:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: TypeScript strict check
        run: npm run typecheck
      - name: P1-P7 regression tests
        run: npm run test:ziwei-ai
      - name: Next.js production build
        run: npm run build
