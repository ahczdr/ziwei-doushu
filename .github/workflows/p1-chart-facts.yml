name: Ziwei AI Release Gate

on:
  push:
    branches:
      - main
      - 'release/**'
      - project/ziwei-ai-integration
      - project/ziwei-ai-p2-ui
      - project/ziwei-ai-p3-pattern-engine
      - project/ziwei-ai-p4-rag
      - project/ziwei-ai-p5-agent
      - project/ziwei-ai-p6-critic
      - project/ziwei-ai-p7-platform
      - project/ziwei-ai-p8-deployment
      - project/ziwei-ai-p9-deployment-automation
  pull_request:
    branches:
      - main
      - 'release/**'
      - project/ziwei-ai-integration
      - project/ziwei-ai-p2-ui
      - project/ziwei-ai-p3-pattern-engine
      - project/ziwei-ai-p4-rag
      - project/ziwei-ai-p5-agent
      - project/ziwei-ai-p6-critic
      - project/ziwei-ai-p7-platform
      - project/ziwei-ai-p8-deployment
      - project/ziwei-ai-p9-deployment-automation

concurrency:
  group: ziwei-ai-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: TypeScript strict check
        run: npm run typecheck

      - name: P1-P9 regression tests
        run: npm run test:ziwei-ai

      - name: Next.js production build
        run: npm run build

      - name: Production HTTP smoke test
        run: npm run smoke:production

      - name: Production Docker image build
        run: docker build --tag ziwei-ai-platform:ci .

      - name: Validate production compose
        run: docker compose -f docker-compose.production.yml config >/dev/null
        env:
          ZIWEI_AI_BASE_URL: https://example.invalid/v1
          ZIWEI_AI_API_KEY: ci-placeholder
          ZIWEI_AI_MODEL: ci-model
          NEXT_PUBLIC_SITE_URL: https://example.invalid

      - name: Critical dependency audit
        run: npm audit --audit-level=critical
