name: P12 Header Inspect

on:
  push:
    branches:
      - ops/p12-preview-acceptance
    paths:
      - '.github/workflows/p12-header-inspect.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect public Production interpret headers without model call
        run: |
          set -euo pipefail
          URL='https://ziwei-ai-platform.vercel.app/api/ziwei-ai/interpret'
          code=$(curl --silent --show-error --dump-header /tmp/headers.txt --output /tmp/body.json --write-out '%{http_code}' \
            --request POST --header 'Content-Type: application/json' --data '{}' "$URL")
          echo "HTTP $code"
          echo '=== response headers ==='
          cat /tmp/headers.txt
          echo '=== safe response summary ==='
          jq -c '{error}' /tmp/body.json
          test "$code" = '400'
          grep -qi '^x-request-id:' /tmp/headers.txt
          grep -qi '^cache-control:.*no-store' /tmp/headers.txt
          jq -e '.error == "invalid-chart-input"' /tmp/body.json >/dev/null
          echo 'P12 response headers verified at the public Production edge.'
