name: Bootstrap Vercel Preview

on:
  push:
    branches:
      - project/ziwei-ai-p10-vercel-deployment
    paths:
      - '.github/workflows/bootstrap-vercel-preview.yml'

permissions:
  contents: read

concurrency:
  group: bootstrap-vercel-preview
  cancel-in-progress: true

env:
  VERCEL_CLI_VERSION: '59.5.0'
  VERCEL_TEAM_ID: team_qPw2lbnCHwH2czTLcopawsqH
  VERCEL_TEAM_SLUG: ahczdr2026-1757
  VERCEL_PROJECT_NAME: ziwei-ai-platform

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Validate Vercel token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "$VERCEL_TOKEN" || { echo 'Missing GitHub Actions secret: VERCEL_TOKEN'; exit 1; }
          echo 'VERCEL_TOKEN is available to this fresh workflow run.'

      - name: Create or reuse Vercel project
        id: project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          API='https://api.vercel.com'
          AUTH="Authorization: Bearer $VERCEL_TOKEN"
          STATUS=$(curl -sS -o /tmp/project.json -w '%{http_code}' -H "$AUTH" "$API/v9/projects/$VERCEL_PROJECT_NAME?teamId=$VERCEL_TEAM_ID")
          if [ "$STATUS" = '404' ]; then
            STATUS=$(curl -sS -o /tmp/project.json -w '%{http_code}' -X POST \
              -H "$AUTH" -H 'Content-Type: application/json' \
              "$API/v10/projects?teamId=$VERCEL_TEAM_ID" \
              --data "{\"name\":\"$VERCEL_PROJECT_NAME\",\"framework\":\"nextjs\"}")
          fi
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
            echo "Vercel project API failed with HTTP $STATUS"
            cat /tmp/project.json
            exit 1
          fi
          PROJECT_ID=$(jq -r '.id // empty' /tmp/project.json)
          test -n "$PROJECT_ID" || { echo 'Vercel project response missing id'; cat /tmp/project.json; exit 1; }
          mkdir -p .vercel
          jq -n --arg projectId "$PROJECT_ID" --arg orgId "$VERCEL_TEAM_ID" '{projectId:$projectId,orgId:$orgId}' > .vercel/project.json
          echo "project_id=$PROJECT_ID" >> "$GITHUB_OUTPUT"
          echo "Project ready: $VERCEL_PROJECT_NAME ($PROJECT_ID)"

      - name: Pull preview environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ env.VERCEL_TEAM_ID }}
          VERCEL_PROJECT_ID: ${{ steps.project.outputs.project_id }}
        run: npx --yes vercel@${VERCEL_CLI_VERSION} pull --yes --environment=preview --scope "$VERCEL_TEAM_SLUG" --token "$VERCEL_TOKEN"

      - name: Build preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ env.VERCEL_TEAM_ID }}
          VERCEL_PROJECT_ID: ${{ steps.project.outputs.project_id }}
        run: npx --yes vercel@${VERCEL_CLI_VERSION} build --scope "$VERCEL_TEAM_SLUG" --token "$VERCEL_TOKEN"

      - name: Deploy preview
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ env.VERCEL_TEAM_ID }}
          VERCEL_PROJECT_ID: ${{ steps.project.outputs.project_id }}
        run: |
          URL=$(npx --yes vercel@${VERCEL_CLI_VERSION} deploy --prebuilt --scope "$VERCEL_TEAM_SLUG" --token "$VERCEL_TOKEN")
          echo "deployment_url=$URL" >> "$GITHUB_OUTPUT"
          echo "Preview deployed: $URL"

      - name: Remote preview smoke
        env:
          ZIWEI_AI_TARGET_URL: ${{ steps.deploy.outputs.deployment_url }}
          ZIWEI_AI_REQUIRE_READY: '0'
          ZIWEI_AI_CHECK_INTERPRET: '0'
        run: node scripts/remote-smoke.mjs

      - name: Summary
        run: |
          echo '## Vercel Preview Bootstrap' >> "$GITHUB_STEP_SUMMARY"
          echo '- Project: `${{ env.VERCEL_PROJECT_NAME }}`' >> "$GITHUB_STEP_SUMMARY"
          echo '- Project ID: `${{ steps.project.outputs.project_id }}`' >> "$GITHUB_STEP_SUMMARY"
          echo '- URL: ${{ steps.deploy.outputs.deployment_url }}' >> "$GITHUB_STEP_SUMMARY"
