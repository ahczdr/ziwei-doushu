name: P12 Firewall Apply

on:
  push:
    branches:
      - ops/p12-preview-acceptance
    paths:
      - '.github/workflows/p12-firewall-apply.yml'

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: project/ziwei-ai-p12-production-guardrails

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Link Vercel project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          npx --yes vercel@59.5.0 link --yes --project ziwei-ai-platform --scope team_qPw2lbnCHwH2czTLcopawsqH --token "$VERCEL_TOKEN"

      - name: Add and publish Interpret rate limit
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          CLI="npx --yes vercel@59.5.0"
          cleanup() {
            echo 'Firewall apply failed; discarding unpublished draft changes.'
            $CLI firewall discard --yes --scope team_qPw2lbnCHwH2czTLcopawsqH --token "$VERCEL_TOKEN" || true
          }
          trap cleanup ERR

          $CLI firewall rules add "Ziwei AI Interpret Rate Limit" \
            --condition '{"type":"path","op":"eq","value":"/api/ziwei-ai/interpret"}' \
            --condition '{"type":"method","op":"eq","value":"POST"}' \
            --action rate_limit \
            --rate-limit-window 60 \
            --rate-limit-requests 3 \
            --rate-limit-keys ip \
            --rate-limit-algo fixed_window \
            --rate-limit-action rate_limit \
            --description 'P12 cost guard: max 3 AI interpretations per 60s per IP.' \
            --yes \
            --scope team_qPw2lbnCHwH2czTLcopawsqH \
            --token "$VERCEL_TOKEN"

          echo '=== Draft rule ==='
          $CLI firewall rules list --expand --scope team_qPw2lbnCHwH2czTLcopawsqH --token "$VERCEL_TOKEN"

          $CLI firewall publish --yes --scope team_qPw2lbnCHwH2czTLcopawsqH --token "$VERCEL_TOKEN"
          trap - ERR

          echo '=== Published rules ==='
          $CLI firewall rules list --expand --scope team_qPw2lbnCHwH2czTLcopawsqH --token "$VERCEL_TOKEN"
