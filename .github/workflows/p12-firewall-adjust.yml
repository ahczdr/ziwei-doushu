name: P12 Firewall Adjust

on:
  push:
    branches:
      - ops/p12-preview-acceptance
    paths:
      - .github/workflows/p12-firewall-adjust.yml

jobs:
  adjust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Link Vercel project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes vercel@59.5.0 link --yes --project ziwei-ai-platform --scope team_qPw2lbnCHwH2czTLcopawsqH --token "$VERCEL_TOKEN"
      - name: Replace and publish Interpret rate limit
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          CLI="npx --yes vercel@59.5.0"
          cleanup() {
            $CLI firewall discard --yes --scope team_qPw2lbnCHwH2czTLcopawsqH --token "$VERCEL_TOKEN" || true
          }
          trap cleanup ERR
          $CLI firewall rules remove "Ziwei AI Interpret Rate Limit" --yes --scope team_qPw2lbnCHwH2czTLcopawsqH --token "$VERCEL_TOKEN"
          $CLI firewall rules add "Ziwei AI Interpret Rate Limit" \
            --condition '{"type":"path","op":"eq","value":"/api/ziwei-ai/interpret"}' \
            --condition '{"type":"method","op":"eq","value":"POST"}' \
            --action rate_limit \
            --rate-limit-window 60 \
            --rate-limit-requests 6 \
            --rate-limit-keys ip \
            --rate-limit-algo fixed_window \
            --rate-limit-action rate_limit \
            --description 'P12 cost guard: max 6 AI interpretations per 60s per IP.' \
            --yes \
            --scope team_qPw2lbnCHwH2czTLcopawsqH \
            --token "$VERCEL_TOKEN"
          $CLI firewall publish --yes --scope team_qPw2lbnCHwH2czTLcopawsqH --token "$VERCEL_TOKEN"
          trap - ERR
          $CLI firewall rules list --expand --scope team_qPw2lbnCHwH2czTLcopawsqH --token "$VERCEL_TOKEN"
      - name: Verify live 6 per 60s limit without model calls
        run: |
          set -euo pipefail
          URL='https://ziwei-ai-platform.vercel.app/api/ziwei-ai/interpret'
          for i in 1 2 3 4 5 6 7; do
            code=$(curl --silent --show-error --output "/tmp/rate-$i.txt" --write-out '%{http_code}' \
              --request POST --header 'Content-Type: application/json' --data '{}' "$URL")
            echo "request $i -> HTTP $code"
            printf '%s' "$code" > "/tmp/rate-$i.code"
          done
          for i in 1 2 3 4 5 6; do
            test "$(cat /tmp/rate-$i.code)" != '429'
          done
          test "$(cat /tmp/rate-7.code)" = '429'
          echo 'Live edge rate limit verified: seventh matching request returned HTTP 429.'
