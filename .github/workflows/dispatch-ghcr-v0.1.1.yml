name: Dispatch GHCR v0.1.1

on:
  push:
    branches:
      - release/v0.1.1
    paths:
      - '.github/workflows/dispatch-ghcr-v0.1.1.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch canonical GHCR publisher at immutable tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run publish-ghcr.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref v0.1.1
          echo 'Dispatched Publish GHCR Image at v0.1.1'
