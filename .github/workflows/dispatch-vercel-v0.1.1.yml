name: Dispatch Vercel v0.1.1

on:
  push:
    branches:
      - release/v0.1.1
    paths:
      - '.github/workflows/dispatch-vercel-v0.1.1.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Deploy immutable v0.1.1 to production
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run deploy-vercel.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref v0.1.1 \
            -f target=production \
            -f project_name=ziwei-ai-platform \
            -f sync_ai_env=true
          echo 'Dispatched Deploy to Vercel at v0.1.1 production.'
