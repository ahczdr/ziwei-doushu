name: Publish v0.1.2

on:
  push:
    branches:
      - ops/v0.1.2-publish
    paths:
      - '.github/workflows/v012-publish.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_TAG: v0.1.2
      RELEASE_SHA: c17a61a4c01993a0aa68c2016ba2002851fa5732
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      - name: Verify release metadata and tag absence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(cat VERSION)" = '0.1.2'
          test "$(node -p "require('./package.json').version")" = '0.1.2'
          test "$(node -p "require('./package-lock.json').version")" = '0.1.2'
          test "$(node -p "require('./package-lock.json').packages[''].version")" = '0.1.2'
          test -f docs/RELEASE_NOTES_v0.1.2.md
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag $RELEASE_TAG already exists; refusing to move it."
            exit 1
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to overwrite it."
            exit 1
          fi

      - name: Create annotated immutable release tag
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$RELEASE_TAG" "$RELEASE_SHA" -m 'Ziwei AI Platform v0.1.2'
          git push origin "refs/tags/$RELEASE_TAG"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title 'Ziwei AI Platform v0.1.2' \
            --notes-file docs/RELEASE_NOTES_v0.1.2.md \
            --verify-tag

      - name: Verify published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,name,isDraft,isPrerelease,url,targetCommitish
          git fetch --tags origin
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$RELEASE_SHA"
          echo "Published $RELEASE_TAG at $RELEASE_SHA"
