name: P12 Preview Acceptance

on:
  push:
    branches:
      - ops/p12-preview-acceptance
    paths:
      - '.github/workflows/p12-preview-acceptance.yml'

permissions:
  contents: read

env:
  VERCEL_CLI_VERSION: '59.5.0'
  VERCEL_TEAM_ID: team_qPw2lbnCHwH2czTLcopawsqH
  VERCEL_PROJECT_NAME: ziwei-ai-platform
  ZIWEI_AI_MODEL_PROFILES_FILE: config/ziwei-ai-model-profiles.json

jobs:
  preview-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout audited P12 branch
        uses: actions/checkout@v4
        with:
          ref: project/ziwei-ai-p12-production-guardrails

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Validate required secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          ZIWEI_AI_BASE_URL: ${{ secrets.ZIWEI_AI_BASE_URL }}
          ZIWEI_AI_API_KEY: ${{ secrets.ZIWEI_AI_API_KEY }}
          ZIWEI_AI_MODEL: ${{ secrets.ZIWEI_AI_MODEL }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          test -n "$ZIWEI_AI_BASE_URL"
          test -n "$ZIWEI_AI_API_KEY"
          test -n "$ZIWEI_AI_MODEL"

      - name: Link Vercel project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@${VERCEL_CLI_VERSION} link --yes --project "$VERCEL_PROJECT_NAME" --scope "$VERCEL_TEAM_ID" --token "$VERCEL_TOKEN"

      - name: Configure Preview provider and P12 safety
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          ZIWEI_AI_BASE_URL: ${{ secrets.ZIWEI_AI_BASE_URL }}
          ZIWEI_AI_API_KEY: ${{ secrets.ZIWEI_AI_API_KEY }}
          ZIWEI_AI_MODEL: ${{ secrets.ZIWEI_AI_MODEL }}
          ZIWEI_AI_API_STYLE: ${{ secrets.ZIWEI_AI_API_STYLE }}
          ZIWEI_AI_TIMEOUT_MS: ${{ secrets.ZIWEI_AI_TIMEOUT_MS }}
          ZIWEI_AI_PROFILES_JSON: ${{ secrets.ZIWEI_AI_PROFILES_JSON }}
          ZIWEI_AI_DEFAULT_PROFILE: ${{ secrets.ZIWEI_AI_DEFAULT_PROFILE }}
        run: |
          set -euo pipefail
          DEFAULT_PROFILES_JSON=$(jq -c . "$ZIWEI_AI_MODEL_PROFILES_FILE")
          EFFECTIVE_PROFILES_JSON="${ZIWEI_AI_PROFILES_JSON:-$DEFAULT_PROFILES_JSON}"
          EFFECTIVE_DEFAULT_PROFILE="${ZIWEI_AI_DEFAULT_PROFILE:-default}"
          EFFECTIVE_TIMEOUT_MS="${ZIWEI_AI_TIMEOUT_MS:-60000}"
          PAYLOAD=$(jq -cn \
            --arg baseUrl "$ZIWEI_AI_BASE_URL" \
            --arg apiKey "$ZIWEI_AI_API_KEY" \
            --arg model "$ZIWEI_AI_MODEL" \
            --arg apiStyle "${ZIWEI_AI_API_STYLE:-auto}" \
            --arg timeoutMs "$EFFECTIVE_TIMEOUT_MS" \
            --arg profilesJson "$EFFECTIVE_PROFILES_JSON" \
            --arg defaultProfile "$EFFECTIVE_DEFAULT_PROFILE" \
            '[
              {key:"ZIWEI_AI_BASE_URL",value:$baseUrl,type:"plain",target:["preview"]},
              {key:"ZIWEI_AI_API_KEY",value:$apiKey,type:"sensitive",target:["preview"]},
              {key:"ZIWEI_AI_MODEL",value:$model,type:"plain",target:["preview"]},
              {key:"ZIWEI_AI_API_STYLE",value:$apiStyle,type:"plain",target:["preview"]},
              {key:"ZIWEI_AI_TIMEOUT_MS",value:$timeoutMs,type:"plain",target:["preview"]},
              {key:"ZIWEI_AI_PROFILES_JSON",value:$profilesJson,type:"sensitive",target:["preview"]},
              {key:"ZIWEI_AI_DEFAULT_PROFILE",value:$defaultProfile,type:"plain",target:["preview"]},
              {key:"ZIWEI_AI_INTERPRET_ENABLED",value:"true",type:"plain",target:["preview"]},
              {key:"ZIWEI_AI_MAX_INFLIGHT",value:"2",type:"plain",target:["preview"]},
              {key:"ZIWEI_AI_MAX_PROVIDER_CALLS",value:"2",type:"plain",target:["preview"]},
              {key:"ZIWEI_AI_ALLOWED_ORIGINS",value:"",type:"plain",target:["preview"]}
            ]')
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.vercel.com/v10/projects/${VERCEL_PROJECT_NAME}/env?teamId=${VERCEL_TEAM_ID}&upsert=true" \
            --header "Authorization: Bearer ${VERCEL_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data "$PAYLOAD" \
            --output /tmp/p12-preview-env.json
          jq -e '(.failed // []) | length == 0' /tmp/p12-preview-env.json >/dev/null

      - name: Pull Preview environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@${VERCEL_CLI_VERSION} pull --yes --environment=preview --scope "$VERCEL_TEAM_ID" --token "$VERCEL_TOKEN"

      - name: Build Preview output
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@${VERCEL_CLI_VERSION} build --scope "$VERCEL_TEAM_ID" --token "$VERCEL_TOKEN"

      - name: Deploy P12 Preview
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          URL=$(npx --yes vercel@${VERCEL_CLI_VERSION} deploy --prebuilt --scope "$VERCEL_TEAM_ID" --token "$VERCEL_TOKEN")
          echo "deployment_url=$URL" >> "$GITHUB_OUTPUT"
          echo "Preview deployed: $URL"

      - name: Validate P12 runtime and real interpretation
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: |
          set -euo pipefail
          CLI="npx --yes vercel@${VERCEL_CLI_VERSION}"

          $CLI curl /api/health --deployment "$DEPLOYMENT_URL" > /tmp/health.json
          jq -e '.status == "ok" and .interpretSafety.state == "configured" and .interpretSafety.enabled == true and .interpretSafety.maxInflight == 2 and .interpretSafety.maxProviderCalls == 2' /tmp/health.json >/dev/null

          $CLI curl /api/ready --deployment "$DEPLOYMENT_URL" > /tmp/ready.json
          jq -e '.ready == true and .aiProvider.state == "configured" and .interpretSafety.state == "configured" and .interpretSafety.enabled == true' /tmp/ready.json >/dev/null

          $CLI curl /api/ziwei-ai/models --deployment "$DEPLOYMENT_URL" > /tmp/models.json
          jq -e '.configured == true and (.profiles | length >= 2)' /tmp/models.json >/dev/null

          $CLI curl /api/ziwei-ai/retrieve --deployment "$DEPLOYMENT_URL" -- \
            --request POST --header 'Content-Type: application/json' \
            --data '{"query":"紫微 天府","limit":2}' > /tmp/retrieve.json
          jq -e '.hits | type == "array"' /tmp/retrieve.json >/dev/null

          $CLI curl /api/ziwei-ai/interpret --deployment "$DEPLOYMENT_URL" -- \
            --request POST --header 'Content-Type: application/json' --max-time 120 \
            --data '{"input":{"calendarType":"solar","date":"2000-8-16","hourIndex":2,"gender":"female"},"topic":"overview","question":"请仅依据命盘事实、格局证据与检索到的古籍证据做一段简要综合解读。"}' > /tmp/interpret.json
          jq -e '.report.sections | type == "array" and length > 0' /tmp/interpret.json >/dev/null
          jq -e '.critic | type == "object"' /tmp/interpret.json >/dev/null
          jq -e '.critic.passed == true' /tmp/interpret.json >/dev/null
          jq -e '.modelProfile | type == "object"' /tmp/interpret.json >/dev/null

          echo '## P12 Preview acceptance' >> "$GITHUB_STEP_SUMMARY"
          echo "- Preview: $DEPLOYMENT_URL" >> "$GITHUB_STEP_SUMMARY"
          jq -r '"- Safety: enabled=`\(.interpretSafety.enabled)` inflight=`\(.interpretSafety.maxInflight)` calls/request=`\(.interpretSafety.maxProviderCalls)`"' /tmp/ready.json >> "$GITHUB_STEP_SUMMARY"
          jq -r '"- AI: profile=`\(.modelProfile.id)` critic=`\(.critic.passed)` revised=`\(.revised)` sections=`\(.report.sections|length)`"' /tmp/interpret.json >> "$GITHUB_STEP_SUMMARY"
