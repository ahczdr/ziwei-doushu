name: P11 Production Dual Model Validation

on:
  push:
    branches:
      - ops/p11-production-dual-model
    paths:
      - '.github/workflows/p11-production-dual-model.yml'

permissions:
  contents: read

env:
  VERCEL_CLI_VERSION: '59.5.0'
  VERCEL_TEAM_ID: team_qPw2lbnCHwH2czTLcopawsqH
  VERCEL_PROJECT_NAME: ziwei-ai-platform
  ZIWEI_AI_PROFILES_JSON: '[{"id":"qwen-plus","label":"Qwen3.7 Plus","model":"qwen3.7-plus","apiStyle":"auto","timeoutMs":120000}]'

jobs:
  deploy-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout audited main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Validate existing server-side secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          ZIWEI_AI_BASE_URL: ${{ secrets.ZIWEI_AI_BASE_URL }}
          ZIWEI_AI_API_KEY: ${{ secrets.ZIWEI_AI_API_KEY }}
          ZIWEI_AI_MODEL: ${{ secrets.ZIWEI_AI_MODEL }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN" || { echo 'Missing VERCEL_TOKEN'; exit 1; }
          test -n "$ZIWEI_AI_BASE_URL" || { echo 'Missing ZIWEI_AI_BASE_URL'; exit 1; }
          test -n "$ZIWEI_AI_API_KEY" || { echo 'Missing ZIWEI_AI_API_KEY'; exit 1; }
          test -n "$ZIWEI_AI_MODEL" || { echo 'Missing ZIWEI_AI_MODEL'; exit 1; }

      - name: Link Vercel project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npx --yes vercel@${VERCEL_CLI_VERSION} link --yes --project "$VERCEL_PROJECT_NAME" --scope "$VERCEL_TEAM_ID" --token "$VERCEL_TOKEN"

      - name: Configure Production model profiles
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          ZIWEI_AI_BASE_URL: ${{ secrets.ZIWEI_AI_BASE_URL }}
          ZIWEI_AI_API_KEY: ${{ secrets.ZIWEI_AI_API_KEY }}
          ZIWEI_AI_MODEL: ${{ secrets.ZIWEI_AI_MODEL }}
          ZIWEI_AI_API_STYLE: ${{ secrets.ZIWEI_AI_API_STYLE }}
        run: |
          set -euo pipefail
          PAYLOAD=$(jq -cn \
            --arg baseUrl "$ZIWEI_AI_BASE_URL" \
            --arg apiKey "$ZIWEI_AI_API_KEY" \
            --arg model "$ZIWEI_AI_MODEL" \
            --arg apiStyle "${ZIWEI_AI_API_STYLE:-auto}" \
            --arg profilesJson "$ZIWEI_AI_PROFILES_JSON" \
            '[
              {key:"ZIWEI_AI_BASE_URL",value:$baseUrl,type:"plain",target:["production"]},
              {key:"ZIWEI_AI_API_KEY",value:$apiKey,type:"sensitive",target:["production"]},
              {key:"ZIWEI_AI_MODEL",value:$model,type:"plain",target:["production"]},
              {key:"ZIWEI_AI_API_STYLE",value:$apiStyle,type:"plain",target:["production"]},
              {key:"ZIWEI_AI_TIMEOUT_MS",value:"60000",type:"plain",target:["production"]},
              {key:"ZIWEI_AI_PROFILES_JSON",value:$profilesJson,type:"sensitive",target:["production"]},
              {key:"ZIWEI_AI_DEFAULT_PROFILE",value:"default",type:"plain",target:["production"]}
            ]')
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.vercel.com/v10/projects/${VERCEL_PROJECT_NAME}/env?teamId=${VERCEL_TEAM_ID}&upsert=true" \
            --header "Authorization: Bearer ${VERCEL_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data "$PAYLOAD" \
            --output /tmp/vercel-production-env-upsert.json
          jq -e '(.failed // []) | length == 0' /tmp/vercel-production-env-upsert.json >/dev/null
          echo 'Production model profiles configured.'

      - name: Pull Production environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npx --yes vercel@${VERCEL_CLI_VERSION} pull --yes --environment=production --scope "$VERCEL_TEAM_ID" --token "$VERCEL_TOKEN"

      - name: Build Production output
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@${VERCEL_CLI_VERSION} build --prod --scope "$VERCEL_TEAM_ID" --token "$VERCEL_TOKEN"

      - name: Deploy audited main to Production
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          URL=$(npx --yes vercel@${VERCEL_CLI_VERSION} deploy --prebuilt --prod --scope "$VERCEL_TEAM_ID" --token "$VERCEL_TOKEN")
          echo "deployment_url=$URL" >> "$GITHUB_OUTPUT"
          echo "Production deployed: $URL"

      - name: Validate Production model registry and two real interpretations
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: |
          set -euo pipefail
          CLI="npx --yes vercel@${VERCEL_CLI_VERSION}"

          $CLI curl /api/health --deployment "$DEPLOYMENT_URL" > /tmp/health.json
          jq -e '.status == "ok"' /tmp/health.json >/dev/null

          $CLI curl /api/ready --deployment "$DEPLOYMENT_URL" > /tmp/ready.json
          jq -e '.ready == true and .aiProvider.state == "configured" and .aiProvider.profileCount >= 2' /tmp/ready.json >/dev/null

          $CLI curl /api/ziwei-ai/models --deployment "$DEPLOYMENT_URL" > /tmp/models.json
          jq -e '.configured == true' /tmp/models.json >/dev/null
          jq -e '(.profiles | map(.id) | index("default")) != null' /tmp/models.json >/dev/null
          jq -e '(.profiles | map(.id) | index("qwen-plus")) != null' /tmp/models.json >/dev/null
          jq -e '(.profiles | map(select(.id == "qwen-plus"))[0]) | (.model == "qwen3.7-plus" and .apiStyle == "messages")' /tmp/models.json >/dev/null

          COMMON='{"input":{"calendarType":"solar","date":"2000-8-16","hourIndex":2,"gender":"female"},"topic":"overview","question":"请仅依据命盘事实、格局证据与检索到的古籍证据，给出简洁综合解读。"}'
          DEFAULT_PAYLOAD=$(printf '%s' "$COMMON" | jq -c '. + {modelProfileId:"default"}')
          QWEN_PAYLOAD=$(printf '%s' "$COMMON" | jq -c '. + {modelProfileId:"qwen-plus"}')

          $CLI curl /api/ziwei-ai/interpret --deployment "$DEPLOYMENT_URL" -- \
            --request POST --header 'Content-Type: application/json' --max-time 120 \
            --data "$DEFAULT_PAYLOAD" > /tmp/default.json
          jq -e '.modelProfile.id == "default"' /tmp/default.json >/dev/null
          jq -e '.report.sections | type == "array" and length > 0' /tmp/default.json >/dev/null
          jq -e '.critic | type == "object"' /tmp/default.json >/dev/null
          jq -e '.critic.passed == true' /tmp/default.json >/dev/null

          $CLI curl /api/ziwei-ai/interpret --deployment "$DEPLOYMENT_URL" -- \
            --request POST --header 'Content-Type: application/json' --max-time 180 \
            --data "$QWEN_PAYLOAD" > /tmp/qwen.json
          jq -e '.modelProfile.id == "qwen-plus" and .modelProfile.model == "qwen3.7-plus" and .modelProfile.apiStyle == "messages"' /tmp/qwen.json >/dev/null
          jq -e '.report.sections | type == "array" and length > 0' /tmp/qwen.json >/dev/null
          jq -e '.critic | type == "object"' /tmp/qwen.json >/dev/null
          jq -e '.critic.passed == true' /tmp/qwen.json >/dev/null

          DEFAULT_PROVIDER=$(jq -r '.providerId // empty' /tmp/default.json)
          QWEN_PROVIDER=$(jq -r '.providerId // empty' /tmp/qwen.json)
          test -n "$DEFAULT_PROVIDER"
          test -n "$QWEN_PROVIDER"
          test "$DEFAULT_PROVIDER" != "$QWEN_PROVIDER"

          echo '## P11 dual-model Production acceptance' >> "$GITHUB_STEP_SUMMARY"
          echo "- Production deployment: $DEPLOYMENT_URL" >> "$GITHUB_STEP_SUMMARY"
          echo '- Public alias: https://ziwei-ai-platform.vercel.app' >> "$GITHUB_STEP_SUMMARY"
          jq -r '"- Default: profile=`\(.modelProfile.id)` protocol=`\(.modelProfile.apiStyle)` critic=`\(.critic.passed)` sections=`\(.report.sections|length)`"' /tmp/default.json >> "$GITHUB_STEP_SUMMARY"
          jq -r '"- Qwen: profile=`\(.modelProfile.id)` model=`\(.modelProfile.model)` protocol=`\(.modelProfile.apiStyle)` critic=`\(.critic.passed)` sections=`\(.report.sections|length)`"' /tmp/qwen.json >> "$GITHUB_STEP_SUMMARY"
