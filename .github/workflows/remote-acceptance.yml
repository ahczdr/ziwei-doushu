name: Remote Deployment Acceptance

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Deployed site base URL, e.g. https://example.com'
        required: true
        type: string

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Remote smoke test
        env:
          ZIWEI_AI_TARGET_URL: ${{ inputs.target_url }}
        run: node scripts/remote-smoke.mjs
