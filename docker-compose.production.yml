services:
  ziwei-ai:
    image: ${ZIWEI_AI_IMAGE:-ghcr.io/ahczdr/ziwei-doushu:latest}
    restart: unless-stopped
    ports:
      - "${ZIWEI_AI_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      ZIWEI_AI_BASE_URL: ${ZIWEI_AI_BASE_URL}
      ZIWEI_AI_API_KEY: ${ZIWEI_AI_API_KEY}
      ZIWEI_AI_MODEL: ${ZIWEI_AI_MODEL}
      ZIWEI_AI_API_STYLE: ${ZIWEI_AI_API_STYLE:-auto}
      ZIWEI_AI_TIMEOUT_MS: ${ZIWEI_AI_TIMEOUT_MS:-60000}
      ZIWEI_AI_PROFILES_JSON: ${ZIWEI_AI_PROFILES_JSON:-}
      ZIWEI_AI_DEFAULT_PROFILE: ${ZIWEI_AI_DEFAULT_PROFILE:-}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
